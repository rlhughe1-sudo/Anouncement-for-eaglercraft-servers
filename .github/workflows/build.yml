
name: Build RydenAnnouncements

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build plugin
        run: mvn -B package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: RydenAnnouncements
          path: target/rydenannouncements-1.0.0.jar
